[package]
name = "evolve-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "evolve_server"
path = "src/lib.rs"

[[bin]]
name = "evo-router"
path = "src/main.rs"

[dependencies]
evolve-core = { workspace = true }
evolve-decision = { workspace = true }
evolve-memory = { workspace = true }
evolve-discovery = { workspace = true }

axum = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
futures = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
tokio-stream = { workspace = true, features = ["sync"] }
bytes = "1"
switchyard-translation = "0.3"
switchyard-protocol = "0.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
bytes = "1"

# 菜单栏托盘：AppKit 原生 NSStatusItem，单二进制双模式（serve/tray）。
# 默认启用——objc2 系是 target 可选依赖，Linux 构建时该 feature 空转无害。
[features]
default = ["tray"]
tray = ["dep:objc2", "dep:objc2-foundation", "dep:objc2-app-kit", "dep:block2", "dep:dispatch2"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true, optional = true }
objc2-foundation = { workspace = true, optional = true }
objc2-app-kit = { workspace = true, optional = true }
block2 = { workspace = true, optional = true }
dispatch2 = { version = "0.3", optional = true, features = ["block2"] }
libc = "0.2"
