    <path d="M 485.3 172.5 A 244 244 0 0 1 172.5 485.3 L 129 430.7 L 191.7 432.7 A 188 188 0 0 0 432.7 191.7 Z"/>
  </g>

  <!-- 深色内核 -->
  <circle cx="256" cy="256" r="158" fill="#000000"/>

  <!-- 白 ER → 提取后镂空 -->
  <text x="256" y="322" text-anchor="middle"
        font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900"
        font-size="200" fill="#ffffff">ER</text>
