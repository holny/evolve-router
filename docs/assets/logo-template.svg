<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- EvolveRouter logo v5 template 变体：与 logo.svg 同几何，全黑扁平——
       macOS template 图标只取 alpha 通道，彩色渐变经 255−亮度提取后会半透明"残缺"。
       白 ER 保持白色 → 提取后为镂空字母。 -->
  <!-- 循环箭头弧 ×2（外缘 r=232 / 内缘 r=176（带宽 56），一体箭尖；两枚中心对称） -->
