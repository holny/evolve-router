<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- EvolveRouter logo：线描决策大脑 + 顶部双路分发 + 底部入站 + 左右对称循环飞轮 -->
  <defs>
    <path id="av" d="M -15 13 L 0 0 L 15 13" fill="none" stroke="currentColor" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 左脑轮廓（右脑镜像复用） -->
    <path id="lobe" d="
      M 248 158
      C 226 132 184 130 166 158
      C 138 158 118 188 128 218
      C 108 240 112 286 136 304
      C 132 342 168 372 204 360
      C 216 374 240 372 248 358
      Z"/>
    <path id="gyri" d="M 168 200 C 186 186 208 192 216 210 M 150 262 C 170 250 194 258 204 278 M 178 330 C 194 316 216 320 226 336"/>
  </defs>

  <g fill="none" stroke="currentColor" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <!-- 大脑：中缝 + 双半球轮廓 + 脑回 -->
    <path d="M 256 152 L 256 366"/>
    <use href="#lobe"/>
    <use href="#lobe" transform="translate(512,0) scale(-1,1)"/>
    <path d="M 168 200 C 186 186 208 192 216 210"/>
    <path d="M 150 262 C 170 250 194 258 204 278"/>
    <path d="M 178 330 C 194 316 216 320 226 336"/>
    <path d="M 344 200 C 326 186 304 192 296 210"/>
    <path d="M 362 262 C 342 250 318 258 308 278"/>
    <path d="M 334 330 C 318 316 296 320 286 336"/>

    <!-- 顶部双路分发箭头 -->
    <path d="M 244 148 C 226 112 208 92 186 66"/>
    <path d="M 268 148 C 286 112 304 92 326 66"/>
    <use href="#av" transform="translate(186,66) rotate(-35)"/>
    <use href="#av" transform="translate(326,66) rotate(35)"/>

    <!-- 左右对称循环飞轮弧（左逆右顺，末端箭头对称） -->
    <path d="M 118 138 A 168 168 0 0 0 112 350"/>
    <path d="M 394 138 A 168 168 0 0 1 400 350"/>
    <path d="M 84 152 L 118 138 L 130 174"/>
    <path d="M 434 336 L 400 350 L 390 316"/>
  </g>

  <!-- 底部入站线 + 端点 -->
  <g stroke="currentColor" stroke-width="26" stroke-linecap="round" fill="none">
    <path d="M 256 372 L 256 424"/>
  </g>
  <circle cx="256" cy="452" r="20" fill="currentColor"/>
</svg>
