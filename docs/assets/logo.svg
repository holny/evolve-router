<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- EvolveRouter logo v4：圆盘即循环——双 C 弧 + 缺口箭头（自进化）+ 白 ER（智能核心）
       循环方向：顺时针（正循环）。渐变沿圆周从青绿到蓝。 -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <path id="av" d="M -17 15 L 0 0 L 17 15" fill="none" stroke="url(#grad)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  </defs>

  <!-- 双 C 弧（r=204，缺口在 -45° 与 135° 方向，各 ~50°） -->
  <g fill="none" stroke="url(#grad)" stroke-width="88">
    <!-- 大弧：160° → -70°（经 180/270/0，逆时针大弧） -->
    <path d="M 64 326 A 204 204 0 1 0 326 64"/>
    <!-- 小弧：-20° → 110° -->
    <path d="M 448 187 A 204 204 0 0 1 186 448"/>
  </g>

  <!-- 缺口箭头（指向顺时针 = 进化方向） -->
  <use href="#av" transform="translate(326,64) rotate(35)"/>
  <use href="#av" transform="translate(186,448) rotate(215)"/>

  <!-- 深色内核（白 ER 的衬底；黑底主题下与背景融合） -->
  <circle cx="256" cy="256" r="158" fill="#0f172a"/>

  <!-- 白 ER 悬浮中央 -->
  <text x="256" y="322" text-anchor="middle"
        font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900"
        font-size="200" fill="#ffffff">ER</text>
</svg>
