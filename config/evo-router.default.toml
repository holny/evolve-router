# EvolveRouter default configuration (M1)
# Copy to evo-router.toml (next to the binary or ~/.evo-router/evo-router.toml)

[server]
host = "127.0.0.1"
port = 8787

[policy]
default = "balanced"
weights = { quality = 0.35, speed = 0.15, cost = 0.25, stability = 0.15, headroom = 0.10 }
sticky_turns = 2
confidence_gate = 0.35

[decision]
backend = "auto"            # auto | heuristic | decision_model (alias: typesafe) | laya
redact = true

# Decision-model slots — THE ONLY place a decision model is configured
# (priority: jev > laya > openai; configure one and it is used; none → heuristic fallback).
# [[decision.slots]]
# kind = "jev"                 # jev | laya | openai
# api_key_env = "TYPESAFE_API_KEY"   # or inline api_key = "..." (chmod 600 this file)
# base_url = ""                # optional for the JEV cloud; required for laya/openai
# model = ""                   # required for openai
# protocol = "system-one"      # optional override: system-one | openai; omit to detect from the URL
#                              # (native-contract third parties, e.g. StartLux / Bamboo /v1/decisions)

[catalog]
remote_fetch = false        # M3

[quota]
learn_from_headers = true   # M2

[data]
dir = "~/.evo-router"

# ---------------------------------------------------------------------------
# Models: declare every upstream model the router may pick.
# M1: user-declared entries only (builtin catalog merges as priors).
